# TechGaon app: builds the Android APK and the web version on every push
name: Build TechGaon app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tools for icons
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-core
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Icon and splash images
        run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 splash.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png
      - name: Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#13513a' --iconBackgroundColorDark '#13513a' --splashBackgroundColor '#0c3a29' --splashBackgroundColorDark '#0c3a29'
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/TechGaon.apk
          cp assets/icon-only.png out/icon.png
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TechGaon v1.0.${{ github.run_number }}
          files: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
